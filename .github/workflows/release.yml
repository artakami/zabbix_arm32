name: Release (ARMv7)

on:
  workflow_dispatch:
    inputs:
      zbx_branch:
        description: "Zabbix branch to release"
        type: choice
        options:
          - "7.0"
          - "7.4"
          - all
        default: all
      component:
        description: "Component to release"
        type: choice
        options:
          - proxy-sqlite3
          - agent2
          - all
        default: all

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set.outputs.branches }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.zbx_branch }}" = "all" ]; then
            echo 'branches=["7.0","7.4"]' >> "$GITHUB_OUTPUT"
          else
            echo "branches=[\"${{ inputs.zbx_branch }}\"]" >> "$GITHUB_OUTPUT"
          fi

  build-proxy:
    needs: matrix
    if: inputs.component == 'proxy-sqlite3' || inputs.component == 'all'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.matrix.outputs.branches) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-proxy.yml
    with:
      zbx_branch: ${{ matrix.branch }}

  build-agent2:
    needs: matrix
    if: inputs.component == 'agent2' || inputs.component == 'all'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.matrix.outputs.branches) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-agent2.yml
    with:
      zbx_branch: ${{ matrix.branch }}
